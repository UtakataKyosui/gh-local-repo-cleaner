name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:biome
      - run: bun run check:fallow
      - run: bun run check:types

  test-and-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Run tests once per OS/architecture. Building and packaging must not call check/test again.
      - run: bun test
      - name: Build the host binary
        run: bun run build --target host
      - name: Verify isolated GitHub CLI installation without Bun on PATH and package
        run: bash scripts/verify-distribution.sh '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: gh-local-repo-cleaner-${{ matrix.platform }}
          path: |
            .crust/distribution/*
            .crust/manifest.json
          include-hidden-files: true
          if-no-files-found: error
