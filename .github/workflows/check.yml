name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:biome
      - run: bun run check:fallow
      - run: bun run check:types

  test-and-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Run tests once per OS. Building and packaging below must not call check/test again.
      - run: bun test
      - name: Build the host binary
        run: bun run build --target host
      - name: Smoke-test the standalone binary
        run: ./.crust/${{ matrix.platform }}/bin/gh-local-repo-cleaner-bun-${{ matrix.platform }} --help
      - name: Archive the binary and adjacent assets
        run: |
          tar -czf gh-local-repo-cleaner-${{ matrix.platform }}.tar.gz -C .crust/${{ matrix.platform }}/bin .
          shasum -a 256 gh-local-repo-cleaner-${{ matrix.platform }}.tar.gz > gh-local-repo-cleaner-${{ matrix.platform }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gh-local-repo-cleaner-${{ matrix.platform }}
          path: |
            gh-local-repo-cleaner-${{ matrix.platform }}.tar.gz
            gh-local-repo-cleaner-${{ matrix.platform }}.tar.gz.sha256
            .crust/manifest.json
          include-hidden-files: true
          if-no-files-found: error
