name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gh-local-repo-cleaner-*
          path: artifacts
      # gh extension install fetches assets named gh-<name>-<os>-<arch> and
      # does not unpack archives, so only the raw binaries are published.
      - name: Collect release assets
        run: |
          mkdir dist
          cp artifacts/*/distribution/gh-local-repo-cleaner-* dist/
          rm -f dist/*.tar.gz
          cd dist
          sha256sum gh-local-repo-cleaner-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            "${prerelease[@]}"
